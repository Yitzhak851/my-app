# nginx site configuration for the YBO social network.
#
#   /            the built React app          (static files from frontend/dist)
#   /api/        the Flask API                (proxied to gunicorn on :5000)
#   /static/uploads/  user-uploaded images    (served straight from disk)
#
# Everything is on ONE origin. That is the point of this file, and it removes a
# whole class of problem in one go: no CORS, no preflight, no third-party-cookie
# rules, no separate API domain to configure in the frontend build. The session
# cookie is a first-party cookie again.
#
# Install:
#   deploy.sh installs this for you, in the right place for the distribution:
#     Debian / Ubuntu    /etc/nginx/sites-available/ybo  (+ a sites-enabled link)
#     Amazon Linux etc.  /etc/nginx/conf.d/ybo.conf      (+ deploy/nginx-main.conf)
#
# Then run certbot (see the deployment guide in README.md) — it edits this file
# in place to add the certificate and the HTTP → HTTPS redirect.

upstream ybo_api {
    server 127.0.0.1:5000 fail_timeout=0;
    keepalive 16;
}

server {
    # default_server: this is the only site on the machine, and it must answer
    # for the bare IP and the EC2 public DNS name as well as for a domain.
    # Without it, on the RHEL family the stock welcome-page server answers
    # first and the app appears not to be deployed.
    listen 80 default_server;
    # No `listen [::]:80` here on purpose. On a host without IPv6 that line is
    # not ignored — nginx refuses to start with
    # "socket() [::]:80 failed (97: Address family not supported by protocol)",
    # and a server that will not start is a worse outcome than one that answers
    # on IPv4 only. Add it back if the instance has an IPv6 address.

    # Replace with your domain, or the EC2 public DNS name if you have no
    # domain yet. certbot reads this line to know what to issue a certificate
    # for, so it has to be right before you run it.
    server_name _;

    root /var/www/ybo;
    index index.html;

    # Do not advertise the exact nginx version to every visitor.
    server_tokens off;

    # An upload is capped at 5 MB by the application (MAX_CONTENT_LENGTH).
    # nginx has to allow at least that much or it rejects the request first,
    # with an HTML error page the frontend cannot parse — the symptom is
    # "unexpected end of JSON input" instead of "that image is too large".
    client_max_body_size 6m;

    # ── security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── the API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://ybo_api;
        proxy_http_version 1.1;

        # ProxyFix in the application reads these. Without X-Forwarded-Proto
        # the app believes it is on plain HTTP even when the browser is on
        # HTTPS, and every link it builds comes out as http:// — which a
        # browser on an https:// page then refuses to load as mixed content.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;

        # An API response is never the right thing to cache at the proxy.
        proxy_buffering off;
    }

    # ── uploaded images ──────────────────────────────────────────────────────
    # Served from disk rather than through Python: a static file does not need
    # a worker, and a worker blocked on a 5 MB image is a worker not answering
    # requests. The filenames are random UUIDs and the content never changes,
    # so it can be cached hard.
    location /static/uploads/ {
        alias /opt/ybo/backend/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";

        # Anything that is not there is simply missing — do not fall through to
        # index.html, or a broken image tag would download the whole app.
        try_files $uri =404;
    }

    # ── the React app ────────────────────────────────────────────────────────
    # Vite fingerprints these filenames, so a given file's contents never
    # change and a year is safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html itself must never be cached, or a returning visitor keeps
    # loading the old build and asking for asset files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        # Client-side routing: /users/3 and /reset-password are React Router
        # paths, not files. Without this fallback, opening one directly — or
        # refreshing on it — is a 404 from nginx, and the app is never reached.
        try_files $uri $uri/ /index.html;
    }

    # A health endpoint that does not depend on the database, so a load balancer
    # can tell "the server is up" from "the database is down".
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
