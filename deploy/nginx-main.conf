# Main nginx configuration for the RHEL family (Amazon Linux, Fedora, CentOS).
#
# Not used on Debian/Ubuntu, which has sites-available and ships a main config
# that stays out of the way.
#
# Why replace the stock one at all: on this family /etc/nginx/nginx.conf
# contains its own `server` block on port 80, marked `default_server`, serving
# the nginx welcome page. That leaves two bad options — add a second
# `default_server` and nginx refuses to start ("duplicate default server"), or
# leave ours without it and the stock block answers first, so every visitor
# gets the welcome page and the app appears not to be deployed at all.
#
# deploy.sh keeps the original at /etc/nginx/nginx.conf.ybo-backup.
#
# @WEB_USER@ is substituted by deploy.sh.

user @WEB_USER@;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    server_tokens off;

    # Text compresses well and the JavaScript bundle is the biggest thing this
    # server sends. Images and fonts are already compressed — running them
    # through gzip costs CPU and saves nothing.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss image/svg+xml;

    # The application's own site, and nothing else. No default server here —
    # that is what deploy/nginx.conf provides.
    include /etc/nginx/conf.d/*.conf;
}
