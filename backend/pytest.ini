[pytest]
testpaths = tests
# Coverage runs by default rather than behind a separate command, so the number
# is in front of whoever ran the tests instead of somewhere they have to ask
# for it. --cov-fail-under makes a drop fail the run: adding untested code is
# then a red test, not a silent slide. The JSON report is what scripts/test.mjs
# reads to print the combined summary.
addopts = -q --cov=app --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=85
